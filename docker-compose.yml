services:
  fwsresize:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        CF_ANALYTICS_TOKEN: ${CF_ANALYTICS_TOKEN:-}
        PLAUSIBLE_DOMAIN: ${PLAUSIBLE_DOMAIN:-}
    container_name: fwsresize
    ports:
      - "${PORT:-3002}:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
